invia_destinazione:
  fields:
    dispositivo:
      selector:
        device:
          integration: gdaauto
    nome:
      required: true
      example: "Casa"
      selector:
        text:
    latitudine:
      required: true
      example: 41.9028
      selector:
        number:
          min: -90
          max: 90
          step: any
    longitudine:
      required: true
      example: 12.4964
      selector:
        number:
          min: -180
          max: 180
          step: any
    indirizzo:
      example: "Piazza Venezia, Roma"
      selector:
        text:
aggiorna:
  fields:
    dispositivo:
      selector:
        device:
          integration: gdaauto
