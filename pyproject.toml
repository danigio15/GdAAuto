[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PIE", "FURB"]
# Le virgolette «così» e i segni × nei commenti sono italiano, non errori.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]
combine-as-imports = true
